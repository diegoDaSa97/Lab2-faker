
# Workflow name
name: CI/CD Pipeline

on:
  # Manually trigger workflow runs
  workflow_dispatch:

  # Trigger the workflow on push from the main branch
  push:
    branches:
      - main

jobs:
  # Tests job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    # Temporary MySQL database for GitHub Actions
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lab12026p
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Environment variables used by Spring Boot during tests
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/lab12026p
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java 17 and Maven cache
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Run tests
      - name: Run Tests
        run: mvn -B test

  #Sonar's Job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Java version
        run: java -version

      - name: Maven version
        run: mvn -version

      - name: Build project
        run: mvn -B clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=diegoDaSa97_Lab2-faker
          -Dsonar.organization=diegodasa97
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=$SONAR_TOKEN