
# Workflow name
name: CI/CD Pipeline

on:
  # Manually trigger workflow runs
  workflow_dispatch:

  # Trigger the workflow on push from the main branch
  push:
    branches:
      - main

jobs:
  # Tests job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    # Temporary MySQL database for GitHub Actions
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lab12026p
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Environment variables used by Spring Boot during tests
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/lab12026p
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Java 17 and Maven cache
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Run tests
      - name: Run Tests
        run: mvn -B test
